name: Token debug (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: raw PUT body
        continue-on-error: true
        run: |
          echo "--- raw PUT dist-tag response body"
          curl -sS -X PUT \
            -H "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"next":"0.2.1-rc.5"}' \
            -w '\nHTTP_CODE:%{http_code}\n' \
            "https://registry.npmjs.org/-/package/@dsh-sparrow%2Fdsh-theme-tone/dist-tags/next" || true
      - name: wrong-otp probe
        continue-on-error: true
        run: |
          echo "--- dist-tag add with bogus OTP (probe whether 2FA gate exists)"
          npm dist-tag add @dsh-sparrow/dsh-theme-tone@0.2.1-rc.5 next --otp=000000 2>&1 | tail -15 || true
      - name: package metadata
        continue-on-error: true
        run: |
          echo "--- packument maintainers / publish config"
          curl -sS "https://registry.npmjs.org/@dsh-sparrow%2Fdsh-theme-tone" | head -c 1200 || true
          echo
          echo "--- package access settings (auth)"
          curl -sS -H "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            -w '\nHTTP_CODE:%{http_code}\n' \
            "https://registry.npmjs.org/-/package/@dsh-sparrow%2Fdsh-theme-tone/access" || true