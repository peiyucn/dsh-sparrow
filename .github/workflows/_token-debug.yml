name: Token debug (temporary)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  debug:
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: whoami
        continue-on-error: true
        run: |
          echo "--- npm whoami"
          npm whoami || true
          echo "--- npm config (masked)"
          npm config get registry || true
      - name: profile
        continue-on-error: true
        run: |
          echo "--- npm profile get (tfa/account state)"
          npm profile get --json || true
      - name: read dist-tags
        continue-on-error: true
        run: |
          echo "--- npm dist-tag ls (read path)"
          npm dist-tag ls @dsh-sparrow/dsh-theme-tone || true
      - name: write dist-tag (diagnose 403 body)
        continue-on-error: true
        run: |
          echo "--- npm dist-tag add (write path, verbose)"
          npm dist-tag add @dsh-sparrow/dsh-theme-tone@0.2.1-rc.5 next --loglevel=verbose 2>&1 | tail -40 || true
