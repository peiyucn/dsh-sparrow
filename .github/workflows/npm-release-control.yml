name: Npm release control

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to perform'
        required: true
        type: choice
        options:
          - promote
          - deprecate
      packages:
        description: 'npm package specs, space separated (e.g. @scope/pkg@version)'
        required: true
        type: string
      version:
        description: 'Version to promote'
        required: false
        type: string
      message:
        description: 'Deprecation message'
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-control:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Fail if NPM_TOKEN is missing
        if: env.NPM_TOKEN == ''
        run: |
          echo "NPM_TOKEN secret is required for npm release-control operations" >&2
          exit 1

      - name: Authenticate with npm registry
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Promote versions to latest
        if: inputs.action == 'promote'
        shell: bash
        run: |
          for spec in ${{ inputs.packages }}; do
            npm dist-tag add "${spec}@${{ inputs.version }}" latest
          done

      - name: Deprecate versions
        if: inputs.action == 'deprecate'
        shell: bash
        run: |
          for spec in ${{ inputs.packages }}; do
            npm deprecate "$spec" "${{ inputs.message }}"
          done