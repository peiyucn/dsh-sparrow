name: Npm release control

on:
  workflow_dispatch:
    inputs:
      action:
        description: '要执行的操作'
        required: true
        type: choice
        options:
          - promote
          - deprecate
          - unpublish
      packages:
        description: 'npm 包 spec 列表（空格分隔，如 @scope/pkg@version）'
        required: true
        type: string
      version:
        description: 'promote 时的版本号'
        required: false
        type: string
      message:
        description: 'deprecate 时的提示文案'
        required: false
        type: string

permissions:
  contents: read

jobs:
  release-control:
    runs-on: ubuntu-latest
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Fail if NPM_TOKEN is missing
        if: env.NPM_TOKEN == ''
        run: |
          echo "NPM_TOKEN secret is required for npm release-control operations" >&2
          exit 1

      - name: Authenticate with npm registry
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc

      - name: Promote versions to latest
        if: inputs.action == 'promote'
        shell: bash
        run: |
          for spec in ${{ inputs.packages }}; do
            npm dist-tag add "${spec}@${{ inputs.version }}" latest
          done

      - name: Deprecate versions
        if: inputs.action == 'deprecate'
        shell: bash
        run: |
          for spec in ${{ inputs.packages }}; do
            npm deprecate "$spec" "${{ inputs.message }}"
          done

      - name: Unpublish versions
        if: inputs.action == 'unpublish'
        shell: bash
        env:
          SPECS: ${{ inputs.packages }}
        run: |
          node --input-type=module <<'NODE'
          const token = process.env.NPM_TOKEN
          const registry = 'https://registry.npmjs.org'
          for (const spec of process.env.SPECS.split(/\s+/).filter(Boolean)) {
            const at = spec.lastIndexOf('@')
            const name = spec.slice(0, at)
            const version = spec.slice(at + 1)
            const escaped = name.replace('/', '%2F')
            const base = `${registry}/${escaped}`
            const get = async () => {
              const res = await fetch(`${base}?write=true`, { headers: { authorization: `Bearer ${token}` } })
              if (!res.ok) throw new Error(`GET ${res.status}: ${await res.text()}`)
              return res.json()
            }
            let pkg = await get()
            if (!pkg.versions?.[version]) {
              console.log(`GONE: ${spec}`)
              continue
            }
            delete pkg.versions[version]
            for (const [tag, value] of Object.entries(pkg['dist-tags'] ?? {})) {
              if (value === version) delete pkg['dist-tags'][tag]
            }
            delete pkg._revisions
            delete pkg._attachments
            for (let attempt = 0; attempt < 3; attempt++) {
              const put = await fetch(`${base}/-rev/${pkg._rev}`, {
                method: 'PUT',
                headers: { authorization: `Bearer ${token}`, 'content-type': 'application/json' },
                body: JSON.stringify(pkg),
              })
              const body = await put.text()
              console.log(`PUT ${spec} attempt=${attempt + 1} status=${put.status} ${body}`)
              if (put.ok) {
                console.log(`UNPUBLISHED: ${spec}`)
                break
              }
              if (attempt === 2) process.exitCode = 1
              pkg = await get()
            }
          }
          NODE

      - name: Verify versions after unpublish
        if: inputs.action == 'unpublish'
        shell: bash
        run: |
          for spec in ${{ inputs.packages }}; do
            if npm view "$spec" version --json >/dev/null 2>&1; then
              echo "STILL EXISTS: $spec"
              exit 1
            fi
            echo "GONE: $spec"
          done