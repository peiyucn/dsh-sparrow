name: debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: node --version
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build:all
      - name: client-guard with default reporter
        working-directory: plugins/dsh-codebuddy-credits
        run: node --test test/client-guard.test.mjs
      - name: import client entry only
        working-directory: plugins/dsh-codebuddy-credits
        run: node -e "import('./lib/client/index.js').then(m => console.log('import ok', Object.keys(m))).catch(e => { console.error(e); process.exit(1) })"
