name: Publish

on:
  push:
    tags:
      - '*-v[0-9]*.[0-9]*.[0-9]*'

      - '*-v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin directory name (e.g. dsh-chat-fim)'
        required: false
        type: string
      version:
        description: 'Version for promote (e.g. 0.1.3-alpha.1); 填写 version/tag 即视为 promote，不再触发 publish'
        required: false
        type: string
      tag:
        description: 'Target dist-tag for promote (latest/next); 填写 version/tag 即视为 promote，不再触发 publish'
        required: false
        type: string








permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: publish


    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.plugin != '' && inputs.version == '' && inputs.tag == '')
    runs-on: ubuntu-latest

    environment: npm-publish


    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0



      - name: Verify commit is on main
        shell: bash
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "::error::tag 提交不在 main 上：先把 dev 合并到 main 再打 tag（E16）"
            exit 1
          fi











      - name: Security alert gate (fail-closed)
        env:
          GH_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::缺少 npm-publish 环境的 secret SECURITY_ALERTS_TOKEN（只读 fine-grained PAT：Dependabot / Code scanning / Secret scanning alerts 三项 read，限本仓库）"
            exit 1
          fi
          count_open() {




            gh api --paginate "repos/${repo}/$1" --jq '.[] | select(.state == "open") | .number' | wc -l | tr -d '[:space:]'
          }
          dependabot="$(count_open dependabot/alerts)"
          codeql="$(count_open code-scanning/alerts)"
          secrets="$(count_open secret-scanning/alerts)"
          echo "open alerts: dependabot=${dependabot} codeql=${codeql} secret-scanning=${secrets}"
          if [[ "${dependabot}" -ne 0 || "${codeql}" -ne 0 || "${secrets}" -ne 0 ]]; then
            echo "::error::unresolved security alerts found; publishing is blocked (root AGENTS E18)"
            exit 1
          fi

      - name: Resolve plugin, version, and npm dist-tag
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == 'push' ]]; then
            TAG="${{ github.ref_name }}"
            PLUGIN="${TAG%-v*}"
            VERSION="${TAG##*-v}"
          else
            PLUGIN="${{ inputs.plugin }}"
            VERSION="$(node -p "require('./plugins/${PLUGIN}/package.json').version")"
          fi




          PIN="$(node -e "
            const peers = require('./plugins/' + process.argv[1] + '/package.json').peerDependencies ?? {};
            const pin = Object.entries(peers)
              .filter(([name]) => name === '@deepseek-ai/dsh' || name.startsWith('@deepseek-ai/dsh-'))
              .map(([, version]) => version)
              .find(version => /^[0-9]+\.[0-9]+\.[0-9]+/.test(version));
            process.stdout.write(pin ?? '');
          " "${PLUGIN}")"
          OFFICIAL_LATEST="$(npm view @deepseek-ai/dsh dist-tags.latest 2>/dev/null || true)"
          OFFICIAL_NEXT="$(npm view @deepseek-ai/dsh dist-tags.next 2>/dev/null || true)"
          if [[ -n "${PIN}" && "${PIN}" == "${OFFICIAL_LATEST}" ]]; then
            NPM_TAG="latest"
          elif [[ -n "${PIN}" && "${PIN}" == "${OFFICIAL_NEXT}" ]]; then
            NPM_TAG="next"
          elif [[ "${VERSION}" == *-alpha.* || "${VERSION}" == *-beta.* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi
          echo "official dsh latest=${OFFICIAL_LATEST:-?} next=${OFFICIAL_NEXT:-?}; pinned=${PIN:-?} -> npm-tag=${NPM_TAG}"
          echo "plugin=${PLUGIN}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "npm-tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile







      - name: Lint and policy checks
        run: pnpm run lint

      - name: Check tag version matches package.json
        if: github.event_name == 'push'
        shell: bash
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${PKG_VERSION}" != "${{ steps.resolve.outputs.version }}" ]]; then
            echo "tag version ${{ steps.resolve.outputs.version }} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Verify plugin
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm run verify



      - name: Publish to npm (token)
        if: env.NPM_TOKEN != ''
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm publish --access public --provenance --tag ${{ steps.resolve.outputs.npm-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (OIDC trusted publishing)
        if: env.NPM_TOKEN == ''
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm publish --access public --provenance --tag ${{ steps.resolve.outputs.npm-tag }}
        env:




          NODE_AUTH_TOKEN: ''







  promote:
    name: promote
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7




      - name: Security alert gate (fail-closed)
        env:
          GH_TOKEN: ${{ secrets.SECURITY_ALERTS_TOKEN }}
        run: |
          set -euo pipefail
          repo="${{ github.repository }}"
          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "::error::缺少 npm-publish 环境的 secret SECURITY_ALERTS_TOKEN（只读 fine-grained PAT：Dependabot / Code scanning / Secret scanning alerts 三项 read，限本仓库）"
            exit 1
          fi
          count_open() {




            gh api --paginate "repos/${repo}/$1" --jq '.[] | select(.state == "open") | .number' | wc -l | tr -d '[:space:]'
          }
          dependabot="$(count_open dependabot/alerts)"
          codeql="$(count_open code-scanning/alerts)"
          secrets="$(count_open secret-scanning/alerts)"
          echo "open alerts: dependabot=${dependabot} codeql=${codeql} secret-scanning=${secrets}"
          if [[ "${dependabot}" -ne 0 || "${codeql}" -ne 0 || "${secrets}" -ne 0 ]]; then
            echo "::error::unresolved security alerts found; dist-tag promotion is blocked (root AGENTS E18)"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org




      - name: Upgrade npm for OIDC dist-tags
        run: npm install -g "npm@^11.21.0"

      - name: Move dist-tag






        run: |
          PLUGIN="${{ inputs.plugin }}"
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"

          if [[ -z "${VERSION}" && -z "${TAG}" ]]; then
            if [[ -z "${PLUGIN}" ]]; then
              echo "::error::本次 workflow_dispatch 没有任何输入（plugin / version / tag 全空），未执行任何操作。要发布请给 plugin；要 promote 请给全 plugin / version / tag。" >&2
              exit 1
            fi
            echo "skip: 只给了 plugin=${PLUGIN}，属 tag 兜底发布（publish job 负责），promote 不适用。"
            exit 0
          fi




          MISSING=""
          if [[ -z "${PLUGIN}"  ]]; then MISSING="${MISSING} plugin";  fi
          if [[ -z "${VERSION}" ]]; then MISSING="${MISSING} version"; fi
          if [[ -z "${TAG}"     ]]; then MISSING="${MISSING} tag";     fi
          if [[ -n "${MISSING}" ]]; then
            echo "::error::promote 需要 plugin / version / tag 三个输入，缺少：${MISSING}。本次运行**未移动任何 dist-tag**，请补齐后重新派发。" >&2
            exit 1
          fi



          if [[ "${TAG}" != "latest" && "${TAG}" != "next" ]]; then
            echo "::error::promote 只允许把版本移到 latest 或 next，收到：${TAG}。本次运行**未移动任何 dist-tag**。" >&2
            exit 1
          fi

          npm dist-tag add "@dsh-sparrow/${PLUGIN}@${VERSION}" "${TAG}"
        env:


          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
