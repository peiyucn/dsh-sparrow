name: Publish

on:
  push:
    tags:
      - '*-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin directory name (e.g. dsh-chat-fim)'
        required: true
        type: string

# id-token: write 用于 npm Trusted Publishing（OIDC）——npm 2027-01 起收紧
# 绕过 2FA 的令牌直接发布，官方方向是 OIDC / staged publishing。
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    # secrets 上下文不能出现在 step 的 if 里（GitHub 会拒绝解析整个工作流，
    # 表现为 0s 失败且无 job），必须先经 job 级 env 中转。
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve plugin, version, and npm dist-tag
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == 'push' ]]; then
            TAG="${{ github.ref_name }}"
            PLUGIN="${TAG%-v*}"
            VERSION="${TAG##*-v}"
          else
            PLUGIN="${{ inputs.plugin }}"
            VERSION="$(node -p "require('./plugins/${PLUGIN}/package.json').version")"
          fi
          # 预发布版本走 next；正式版本走 latest，避免未稳定的包顶掉 latest。
          if [[ "${VERSION}" == *-* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi
          echo "plugin=${PLUGIN}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "npm-tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v4
        with:
          version: 11.22.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag version matches package.json
        if: github.event_name == 'push'
        shell: bash
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${PKG_VERSION}" != "${{ steps.resolve.outputs.version }}" ]]; then
            echo "tag version ${{ steps.resolve.outputs.version }} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Verify plugin
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm run verify

      # 双模式鉴权：有 NPM_TOKEN 用 Automation token（首发必需——npm 的
      # trusted publisher 配置需要包已存在）；没有则走 OIDC 信任发布。
      - name: Publish to npm (token)
        if: env.NPM_TOKEN != ''
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm publish --access public --provenance --tag ${{ steps.resolve.outputs.npm-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (OIDC trusted publishing)
        if: env.NPM_TOKEN == ''
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm publish --access public --provenance --tag ${{ steps.resolve.outputs.npm-tag }}
