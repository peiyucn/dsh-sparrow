name: Publish

on:
  push:
    tags:
      - '*-v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin directory name (e.g. dsh-chat-fim)'
        required: false
        type: string

# id-token: write 用于 npm Trusted Publishing（OIDC）；contents: write 用于自动建 GitHub Release
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # npm 发布环境：Deployments 页留下发布记录，NPM_TOKEN 作用域收窄到环境级（pi 仓库同款做法）
    environment: npm-publish
    # secrets 上下文不能出现在 step 的 if 里（GitHub 会拒绝解析整个工作流，
    # 表现为 0s 失败且无 job），必须先经 job 级 env 中转。
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve plugin, version, and npm dist-tag
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == 'push' ]]; then
            TAG="${{ github.ref_name }}"
            PLUGIN="${TAG%-v*}"
            VERSION="${TAG##*-v}"
          else
            PLUGIN="${{ inputs.plugin }}"
            VERSION="$(node -p "require('./plugins/${PLUGIN}/package.json').version")"
          fi
          # 预发布版本走 next；正式版本走 latest，避免未稳定的包顶掉 latest。
          if [[ "${VERSION}" == *-* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi
          echo "plugin=${PLUGIN}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "npm-tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag version matches package.json
        if: github.event_name == 'push'
        shell: bash
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${PKG_VERSION}" != "${{ steps.resolve.outputs.version }}" ]]; then
            echo "tag version ${{ steps.resolve.outputs.version }} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Verify plugin
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm run verify

      # 双模式鉴权：有 NPM_TOKEN 用 Automation token（首发必需——npm 的
      # trusted publisher 配置需要包已存在）；没有则走 OIDC 信任发布。
      - name: Publish to npm (token)
        if: env.NPM_TOKEN != ''
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm publish --access public --provenance --tag ${{ steps.resolve.outputs.npm-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (OIDC trusted publishing)
        if: env.NPM_TOKEN == ''
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm publish --access public --provenance --tag ${{ steps.resolve.outputs.npm-tag }}

      # GitHub Release 是 publish 的内部步骤：说明由两份 CHANGELOG 当前版本条目拼成
      # （英文在上、中文在下；两份都缺条目时回退 --generate-notes）；预发布版本
      # （版本号含 -）标 prerelease，稳定版不标；不附产物
      # （npm 用户一律走 registry 安装，对齐官方 DSH 惯例）
      - name: Create GitHub Release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PLUGIN="plugins/${{ steps.resolve.outputs.plugin }}"
          VERSION="${{ steps.resolve.outputs.version }}"
          if [[ "${VERSION}" == *-* ]]; then PRERELEASE_FLAG="--prerelease"; else PRERELEASE_FLAG=""; fi
          awk -v ver="${VERSION}" '/^## / { if (started) exit; if ($0 ~ "^## " ver " ") started = 1; next } started' "$PLUGIN/CHANGELOG.md" > release-notes-en.md
          awk -v ver="${VERSION}" '/^## / { if (started) exit; if ($0 ~ "^## " ver " ") started = 1; next } started' "$PLUGIN/CHANGELOG.zh-CN.md" > release-notes-zh.md
          if [[ ! -s release-notes-en.md && ! -s release-notes-zh.md ]]; then
            echo "::warning::CHANGELOG entry for ${VERSION} not found, falling back to --generate-notes"
            gh release create "${{ github.ref_name }}" ${PRERELEASE_FLAG} --generate-notes
            exit 0
          fi
          {
            if [[ -s release-notes-en.md ]]; then printf '### English\n\n'; cat release-notes-en.md; fi
            if [[ -s release-notes-zh.md ]]; then printf '\n### 中文\n\n'; cat release-notes-zh.md; fi
          } > release-notes.md
          gh release create "${{ github.ref_name }}" ${PRERELEASE_FLAG} --notes-file release-notes.md
