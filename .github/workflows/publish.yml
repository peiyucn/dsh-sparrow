name: Publish

on:
  push:
    tags:
      - '*-v[0-9]*.[0-9]*.[0-9]*'
      # 预发布后缀（-alpha.N 等）：稳定版模式全串匹配不到带连字符的 tag
      - '*-v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin directory name (e.g. dsh-chat-fim)'
        required: false
        type: string

# id-token: write 用于 npm Trusted Publishing（OIDC）；contents: write 用于自动建 GitHub Release
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # npm 发布环境：Deployments 页留下发布记录，NPM_TOKEN 作用域收窄到环境级（pi 仓库同款做法）
    environment: npm-publish
    # secrets 上下文不能出现在 step 的 if 里（GitHub 会拒绝解析整个工作流，
    # 表现为 0s 失败且无 job），必须先经 job 级 env 中转。
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve plugin, version, and npm dist-tag
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == 'push' ]]; then
            TAG="${{ github.ref_name }}"
            PLUGIN="${TAG%-v*}"
            VERSION="${TAG##*-v}"
          else
            PLUGIN="${{ inputs.plugin }}"
            VERSION="$(node -p "require('./plugins/${PLUGIN}/package.json').version")"
          fi
          # 临时（2026-09-03 定）：官方 0.1.2-rc.1 落地前，alpha 版本也直发 latest
          # （当前无稳定轨可服务，next 空转无意义）。0.1.2-rc.1 落地后恢复双通道：
          # 版本含 `-` 发 next、正式版发 latest。
          NPM_TAG="latest"
          echo "plugin=${PLUGIN}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "npm-tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check tag version matches package.json
        if: github.event_name == 'push'
        shell: bash
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${PKG_VERSION}" != "${{ steps.resolve.outputs.version }}" ]]; then
            echo "tag version ${{ steps.resolve.outputs.version }} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Verify plugin
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm run verify

      # 双模式鉴权：有 NPM_TOKEN 用 Automation token（首发必需——npm 的
      # trusted publisher 配置需要包已存在）；没有则走 OIDC 信任发布。
      - name: Publish to npm (token)
        if: env.NPM_TOKEN != ''
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm publish --access public --provenance --tag ${{ steps.resolve.outputs.npm-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (OIDC trusted publishing)
        if: env.NPM_TOKEN == ''
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm publish --access public --provenance --tag ${{ steps.resolve.outputs.npm-tag }}

      # 不建 GitHub Release：多包单仓库下 Release/Latest 语义混乱；发布记录 =
      # npm dist-tag（latest/next）+ annotated tag（tag 页自带说明）；
      # CHANGELOG 看仓库文件与各插件 README 的 Changelog 链接。
