name: Publish

on:
  push:
    tags:
      - '*-v[0-9]*.[0-9]*.[0-9]*'
      # 预发布后缀（-alpha.N 等）：稳定版模式全串匹配不到带连字符的 tag
      - '*-v[0-9]*.[0-9]*.[0-9]*-*'
  workflow_dispatch:
    inputs:
      plugin:
        description: 'Plugin directory name (e.g. dsh-chat-fim)'
        required: false
        type: string
      version:
        description: 'Version for promote (e.g. 0.1.3-alpha.1); 填写 version/tag 即视为 promote，不再触发 publish'
        required: false
        type: string
      tag:
        description: 'Target dist-tag for promote (latest/next); 填写 version/tag 即视为 promote，不再触发 publish'
        required: false
        type: string

# id-token: write 用于 npm Trusted Publishing（OIDC）；contents: write 用于自动建 GitHub Release
permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: publish
    # workflow_dispatch 有两种用途：tag 兜底发布（只给 plugin）与 promote（给 plugin/version/tag）。
    # 后者绝不能同时跑 publish，否则会把 package.json 当前版本误发出去——按输入严格区分。
    if: >-
      github.event_name == 'push'
      || (github.event_name == 'workflow_dispatch' && inputs.plugin != '' && inputs.version == '' && inputs.tag == '')
    runs-on: ubuntu-latest
    # npm 发布环境：Deployments 页留下发布记录，NPM_TOKEN 作用域收窄到环境级（pi 仓库同款做法）
    environment: npm-publish
    # secrets 上下文不能出现在 step 的 if 里（GitHub 会拒绝解析整个工作流，
    # 表现为 0s 失败且无 job），必须先经 job 级 env 中转。
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve plugin, version, and npm dist-tag
        id: resolve
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == 'push' ]]; then
            TAG="${{ github.ref_name }}"
            PLUGIN="${TAG%-v*}"
            VERSION="${TAG##*-v}"
          else
            PLUGIN="${{ inputs.plugin }}"
            VERSION="$(node -p "require('./plugins/${PLUGIN}/package.json').version")"
          fi
          # 双通道（官方 0.1.2-rc.1 落地后生效）：alpha/beta 预发布发 next，
          # rc 与纯数字稳定版发 latest——版本线镜像官方 dsh，稳定版带 rc 标记
          # （0.1.2-rc.1 即稳定线，目标 dist-tag 是 latest）。
          if [[ "$VERSION" == *-alpha.* || "$VERSION" == *-beta.* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi
          echo "plugin=${PLUGIN}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "npm-tag=${NPM_TAG}" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 根守卫链（`pnpm run check` = check:paths + check:dsh-pin + check:plugin-docs）：
      # tag 发布会绕过 CI（ci.yml 只在 push dev/main 与 PR 上跑），所以这里必须自己跑一遍，
      # 否则"文档没跟版 / 文档漂移 / 本机路径泄漏"会**直接随发布出门**。
      # fail-closed：守卫红 → 这一步失败 → 后面的 publish 步骤不执行。
      # ⚠️ 新增守卫只需加进根 `check`，这里自动覆盖；别在此逐个列脚本。
      - name: Guard chain (root pnpm run check)
        run: pnpm run check

      - name: Check tag version matches package.json
        if: github.event_name == 'push'
        shell: bash
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [[ "${PKG_VERSION}" != "${{ steps.resolve.outputs.version }}" ]]; then
            echo "tag version ${{ steps.resolve.outputs.version }} does not match package.json version ${PKG_VERSION}" >&2
            exit 1
          fi

      - name: Verify plugin
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm run verify

      # 双模式鉴权：有 NPM_TOKEN 用 Automation token（首发必需——npm 的
      # trusted publisher 配置需要包已存在）；没有则走 OIDC 信任发布。
      - name: Publish to npm (token)
        if: env.NPM_TOKEN != ''
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm publish --access public --provenance --tag ${{ steps.resolve.outputs.npm-tag }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm (OIDC trusted publishing)
        if: env.NPM_TOKEN == ''
        working-directory: plugins/${{ steps.resolve.outputs.plugin }}
        run: npm publish --access public --provenance --tag ${{ steps.resolve.outputs.npm-tag }}

      # 不建 GitHub Release：多包单仓库下 Release/Latest 语义混乱；发布记录 =
      # npm dist-tag（latest/next）+ annotated tag（tag 页自带说明）；
      # CHANGELOG 看仓库文件与各插件 README 的 Changelog 链接。

  # 版本运维：alpha 发 next → owner 验证后把同一版本号抬到 latest（不重发包，
  # 只移 dist-tag）。deprecate 不提供（owner 本机手动执行）。
  promote:
    name: promote
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: npm-publish
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Move dist-tag
        # workflow_dispatch 有三种输入形态，必须分开对待（否则要么静默成功、要么误报红）：
        #   ① 只给 plugin       → tag 兜底发布（真正干活的是 publish job），promote 不适用 → 跳过
        #   ② 给 version 或 tag → 这是 promote 请求 → plugin/version/tag **三个必须齐**，缺一即失败
        #   ③ 什么都不给        → 这次派发毫无意义，绝不能显示绿色
        # ⚠️ 原实现把 ①②③ 一律 `echo skip` + `exit 0`：run 是绿的、stderr 一行 skip，
        #    owner 会把绿色误读成「promote 已完成」，而 dist-tag 根本没动（实测：exit 0）。
        run: |
          PLUGIN="${{ inputs.plugin }}"
          VERSION="${{ inputs.version }}"
          TAG="${{ inputs.tag }}"

          if [[ -z "${VERSION}" && -z "${TAG}" ]]; then
            if [[ -z "${PLUGIN}" ]]; then
              echo "::error::本次 workflow_dispatch 没有任何输入（plugin / version / tag 全空），未执行任何操作。要发布请给 plugin；要 promote 请给全 plugin / version / tag。" >&2
              exit 1
            fi
            echo "skip: 只给了 plugin=${PLUGIN}，属 tag 兜底发布（publish job 负责），promote 不适用。"
            exit 0
          fi

          # 用显式 if，不用 `[[ -z "$X" ]] && MISSING="..."`：后者是 AND 列表，
          # 在 `bash -e`（Actions 的 `run:` 默认）下靠一条"非最后一条命令不触发 errexit"
          # 的豁免才不出错 —— 能用但脆，直接写 if 没有任何歧义。
          MISSING=""
          if [[ -z "${PLUGIN}"  ]]; then MISSING="${MISSING} plugin";  fi
          if [[ -z "${VERSION}" ]]; then MISSING="${MISSING} version"; fi
          if [[ -z "${TAG}"     ]]; then MISSING="${MISSING} tag";     fi
          if [[ -n "${MISSING}" ]]; then
            echo "::error::promote 需要 plugin / version / tag 三个输入，缺少：${MISSING}。本次运行**未移动任何 dist-tag**，请补齐后重新派发。" >&2
            exit 1
          fi

          npm dist-tag add "@dsh-sparrow/${PLUGIN}@${VERSION}" "${TAG}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
