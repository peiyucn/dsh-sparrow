name: CI

on:
  push:
    branches: [dev, main]
  pull_request:

permissions:
  contents: read

jobs:
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all plugins
        run: pnpm run typecheck:all

  test:
    name: test
    needs: typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck all plugins (produce lib/ for tests)
        run: pnpm run typecheck:all
      - name: Test all plugins
        run: pnpm run test:all

  build:
    name: build
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "build 空跑（lib/ 由 tsc 在 typecheck 过程产出）"

  package:
    name: package
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "package 空跑（打包内置于 npm publish）"

  publish:
    name: publish
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "publish 实质由 publish.yml 在 tag 触发时执行，此处空跑占位"

  deploy:
    name: deploy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "deploy 空跑（本仓库无部署目标）"

  sync:
    name: sync
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: No-op
        run: echo "sync 空跑（本仓库无数据同步）"
