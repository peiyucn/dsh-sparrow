# dsh-chat-suggest 组合补丁：`dsh plugin --profile web add dsh-chat-suggest` 安装后由 profile 自动挂载。
# 配置值均为安全默认值；API key 只经 ctx.credentials 解析，绝不写在这里。
- insert:
    - id: dsh-chat-suggest
      name: dsh-chat-suggest
      config:
        baseURL: https://api.deepseek.com/beta
        model: deepseek-v4-pro
        maxTokens: 96
        apiKeyEnv: DEEPSEEK_API_KEY
        requestTimeoutMs: 30000
        maxBodyBytes: 65536
        maxPromptChars: 32768
        suggestionCount: 1
        temperature: 0.3
