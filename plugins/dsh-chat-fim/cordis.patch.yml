

- insert:
    - id: dsh-chat-fim
      name: '@dsh-sparrow/dsh-chat-fim'
      config:
        baseURL: https://api.deepseek.com/beta
        model: deepseek-flash
        maxTokens: 96
        apiKeyEnv: DEEPSEEK_API_KEY
        requestTimeoutMs: 30000
        maxBodyBytes: 65536
        maxPromptChars: 32768
        suggestionCount: 1
        temperature: 0.3
