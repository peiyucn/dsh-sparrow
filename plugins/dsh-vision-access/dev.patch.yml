# 本地开发补丁：dsh checkout 内 dev:web / --patch overlay 使用；name 是本机绝对路径。
- insert:
    - id: dsh-vision-access
      name: file:///C:/Users/DJ028191/pyai-meta-repo/dsh-sparrow/plugins/dsh-vision-access/src/index.ts
      config:
        subagentProvider: spawn
        visionModel: deepseek-v4-flash-vision-exp
        maxTokens: 8192
        visionReasoningEffort: low
        cacheMaxEntries: 64
        textRoutes:
