# dsh-vision-access 组合补丁：门禁放行只对以下文本路由生效。
- insert:
    - id: dsh-vision-access
      name: dsh-vision-access
      config:
        visionProvider: deepseek-official
        visionModel: deepseek-v4-flash-vision-exp
        maxTokens: 8192
        temperature: 0.2
        visionReasoningEffort: low
        cacheMaxEntries: 64
        textRoutes:
          - provider: deepseek-official
            model: deepseek-v4-pro
          - provider: deepseek-official
            model: deepseek-v4-flash
