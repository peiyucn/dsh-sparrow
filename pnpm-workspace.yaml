packages:
  - "plugins/*"

# esbuild 安装脚本需要落平台二进制；pnpm 11 默认拦截构建脚本，这里显式放行。
allowBuilds:
  # 经 @deepseek-ai/dsh-llm-pi-ai 传入的传递依赖，不跑安装脚本
  '@google/genai': false
  esbuild: true
  protobufjs: false

# pnpm 供应链策略要求 24h 内的新版本显式放行；该配置**不支持带版本的 glob**，只能逐条列。
# 下面 = 六个活跃插件在 dsh 0.1.7-rc.2 上的官方包闭包（按 checkout manifests 重算，含 peer / dependencies 边）
#  + lockfile 里出现的其它 @deepseek-ai/*（cordis 插件族等）。发布满 24h 后可整段删。
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.4'
  - '@deepseek-ai/cordis-plugin-group@1.0.4'
  - '@deepseek-ai/cordis-plugin-include@1.0.9'
  - '@deepseek-ai/cordis-plugin-loader@1.0.5'
  - '@deepseek-ai/cordis-plugin-timer@1.1.6'
  - '@deepseek-ai/cosmokit@1.8.5'
  - '@deepseek-ai/schemastery@3.18.4'
  - '@deepseek-ai/dsh-agent@0.1.7-rc.2'
  - '@deepseek-ai/dsh-agent-default-model@0.1.7-rc.2'
