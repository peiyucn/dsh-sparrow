# @deepseek-ai/cordis 是 dsh 内置 cordis 的 fork：npm 上只发布了 4.0.x，没有插件 peerDeps
# 所写的 0.1.1-rc.2（dsh 包本体在 npm 有 0.1.1-rc.2）。实际运行环境（dsh ≥ 0.1.2-alpha.1）
# 也用 4.0.1，因此整个 workspace 统一 override 到 npm 的 4.0.1。
#
# dsh 各 dsh-* 包之间的依赖经 workspace:^ 发布后被重写为 ">=0.1.5 <0.2.0-0"，该范围按 semver
# 匹配不到任何已发布版本（0.1.5-rc.2 是预发布版，排序低于 0.1.5）——官方 monorepo 内靠
# workspace 互链不踩此坑，npm 消费者全踩。下面把六个插件依赖到的官方包完整闭包逐个 override
# 到 0.1.5-rc.2 以恢复解析（2026-09-10，闭包按 checkout tag dsh-v0.1.5-rc.2 的 manifests 计算，
# 含 peer 边）；官方发布稳定版或修正发布范围后移除。
#
# 刻意不列的 @deepseek-ai/*：cordis（fork，见上）、schemastery（v3.18.2 独立版本线，
# 插件在 dependencies 里按 ^3.18.2 正常解析）、dsh-client-runtime（npm 最新仅到 0.1.1-rc.2，
# 没有 0.1.5-rc.2，插件按其自身版本线保持不变）。
overrides:
  "@deepseek-ai/cordis": "4.0.1"
  "@deepseek-ai/dsh-agent": "0.1.5-rc.2"
  "@deepseek-ai/dsh-anonymous-user-id": "0.1.5-rc.2"
