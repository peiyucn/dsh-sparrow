packages:
  - "plugins/*"

# esbuild 安装脚本需要落平台二进制；pnpm 11 默认拦截构建脚本，这里显式放行。
allowBuilds:
  # 经 @deepseek-ai/dsh-llm-pi-ai 传入的传递依赖，不跑安装脚本
  '@google/genai': false
  esbuild: true
  protobufjs: false

# 0.1.5-rc.2 当天发布（2026-09-10 14:57），pnpm 供应链策略对 24h 内的新版本要求显式白名单；
# 24h 后本段可整体删除（pnpm 会自动维护——它曾在首次安装时自动追加过 12 条）。
minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.1.5-rc.2'
  - '@deepseek-ai/dsh-anonymous-user-id@0.1.5-rc.2'
  - '@deepseek-ai/dsh-atomic-write@0.1.5-rc.2'
