packages:
  - "plugins/*"

# esbuild 安装脚本需要落平台二进制；pnpm 11 默认拦截构建脚本，这里显式放行。
allowBuilds:
  esbuild: true

minimumReleaseAgeExclude:
  - '@deepseek-ai/dsh-agent@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-brand@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-invariants@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-llm@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-scope@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-session-projection@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-session@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-system-prompt@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-timeout@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-typert-protocol@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-util-crypto@0.1.2-alpha.4'
  - '@deepseek-ai/dsh-util-values@0.1.2-alpha.4'

# @deepseek-ai/cordis 是 dsh 内置 cordis 的 fork：npm 上只发布了 4.0.x，没有插件 peerDeps
# 所写的 0.1.1-rc.2（dsh 包本体在 npm 有 0.1.1-rc.2）。实际运行环境（dsh ≥ 0.1.2-alpha.1）
# 也用 4.0.1，因此整个 workspace 统一 override 到 npm 的 4.0.1。
#
# dsh 0.1.2-alpha.4 的包间依赖经 workspace:^ 发布重写为 ">=0.1.2 <0.2.0-0"，该范围按 semver
# 匹配不到任何已发布版本（0.1.2-alpha.4 是预发布版，排序低于 0.1.2）——官方 monorepo 内靠
# workspace 互链不踩此坑，npm 消费者全踩。下面逐个 override 到 0.1.2-alpha.4 以恢复解析
# （2026-09-01）；官方发布稳定 0.1.2 或修正发布范围后移除。
overrides:
  "@deepseek-ai/cordis": "4.0.1"
  "@deepseek-ai/dsh-agent": "0.1.2-alpha.4"
  "@deepseek-ai/dsh-brand": "0.1.2-alpha.4"
  "@deepseek-ai/dsh-invariants": "0.1.2-alpha.4"
  "@deepseek-ai/dsh-llm": "0.1.2-alpha.4"
  "@deepseek-ai/dsh-scope": "0.1.2-alpha.4"
  "@deepseek-ai/dsh-session": "0.1.2-alpha.4"
  "@deepseek-ai/dsh-session-projection": "0.1.2-alpha.4"
  "@deepseek-ai/dsh-system-prompt": "0.1.2-alpha.4"
  "@deepseek-ai/dsh-timeout": "0.1.2-alpha.4"
  "@deepseek-ai/dsh-typert-protocol": "0.1.2-alpha.4"
  "@deepseek-ai/dsh-util-crypto": "0.1.2-alpha.4"
  "@deepseek-ai/dsh-util-values": "0.1.2-alpha.4"
